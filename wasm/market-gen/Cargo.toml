[package]
name = "market-gen"
version = "0.1.0"
edition = "2024"
description = "Simulated market-update generator compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
