name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/market-gen

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - run: npm ci

      - name: Test Wasm
        run: npm run test:wasm

      - name: Build Wasm
        run: npm run build:wasm

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # SPA fallback: GitHub Pages serves 404.html for unknown paths
      - run: cp dist/findev/browser/index.html dist/findev/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/findev/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
